version: '3.8'

services:
  juice-shop:
    image: bkimminich/juice-shop:v15.0.0
    container_name: juice-shop-lab
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=unsafe
    networks:
      - pentest-isolated-net

networks:
  pentest-isolated-net:
    driver: bridge
